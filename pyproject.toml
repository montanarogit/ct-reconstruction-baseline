[project]
name = "ct-reconstruction-baseline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pydicom>=3.0.2",
    "requests>=2.34.2",
